services:
  db:
    image: postgres:18.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_HOST_PORT}:${DB_PORT}'


  app:
    build: .
    ports:
      - '${ALLSAFE_HOST_PORT}:${ALLSAFE_CONTAINER_PORT}'
    depends_on:
      db:
        restart: true
        condition: service_healthy

volumes:
  db-data:
    name: 'postgres'
      