name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Ruff
        run: python -m pip install ruff==0.16.1

      - name: linter
        run: ruff check .

      - name: formatter
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
        
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  bandit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install bandit
        run: python -m pip install bandit==1.9.4

      - name: bandit
        run: bandit -r app

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ghcr.io/aluetov/allsafe:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/aluetov/allsafe:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library

      - name: Save Docker image
        run: docker save ghcr.io/aluetov/allsafe:${{ github.sha }} -o allsafe-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: allsafe-image
          path: allsafe-image.tar
          retention-days: 1

  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    needs:
      - ruff
      - pytest
      - bandit
      - gitleaks
      - trivy
    
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: allsafe-image
    
      - name: Load Docker image
        run: docker load -i allsafe-image.tar

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        run: docker push ghcr.io/aluetov/allsafe:${{ github.sha }}